# Config for CEAFM-CU
defaults:
  - _self_

data:
  tickers: ["AAPL", "MSFT", "SPY"]
  start_date: "2018-01-01"
  end_date: "2024-12-31"
  lookback: 60
  horizon: 1
  pre_window: "1D"
  post_window: "1D"

model:
  ts_dim: 6
  embed_dim: 384
  event_meta_dim: 8
  d_model: 128
  quantiles: [0.1, 0.5, 0.9]

training:
  batch_size: 64
  lr: 1e-3
  epochs: 50
  lambda_quantile: 1.0
  lambda_nll: 0.1
  use_causal_aug: true
  p_mask: 0.3
  p_swap: 0.2

eval:
  regime_split: true
  event_window_eval: true
  compute_calibration: true
