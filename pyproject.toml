[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regchange-fom"
version = "0.1.0"
description = "Calibration of TSFMs and TFMs Across SEBI's F&O Reforms"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "statsmodels",
    "arch",
    "torch",
    "transformers",
    "sentence-transformers",
    "yfinance",
    "nsepy",
    "pandas-datareader",
    "fredapi",
    "tqdm",
    "hydra-core",
    "omegaconf",
    "wandb",
    "matplotlib",
    "seaborn",
    "pyyaml",
    "rich",
    "click",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["regchange*"]
